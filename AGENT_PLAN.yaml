project:
  name: Apianocraft
  type: browser_piano_workstation
  stack:
    - React 19
    - TypeScript 5.8
    - Vite 6
    - Web Audio API
    - PWA (vite-plugin-pwa)
    - puppeteer-core (headless smoke tests)
  description: Low-latency browser piano / digital keyboard workstation, fully client-side.

current_phase:
  id: "14"
  name: "Instrument Library Expansion & 38-Key QWERTY Keyboard Redesign"
  status: completed_and_verified
  detail: |
    Implemented 38-key continuous chromatic QWERTY piano keyboard (MIDI 48..85, C3..C#6) with Sargam mode (C# = Sa),
    3 range sections (-1 / 0 / +1), zero modifier requirements, 10 new expressive instrument classes,
    and 360/360 smoke checks passing across 3 consecutive runs.
    Produced FRONTEND_REDESIGN_PLAN.md (Implementation-Ready UI Redesign Strategy).

