architecture_rules:
  - "One persistent AudioContext."
  - "Audio engine independent of React; React never on the note hot path."
  - "No unnecessary audio nodes per note; no effect-chain rebuilds on parameter changes."
  - "Schedule with AudioContext.currentTime; use AudioParam automation."
  - "No arbitrary sleeps to solve audio timing problems; wait on engine state."
  - "Preserve pending-load/pending-off correctness; dropped notes must never become stuck or accidentally sustained."
  - "Voice pooling and adaptive polyphony remain bounded."
  - "Sample buffers shared via SampleBank/decode cache; no duplicate decoding."
  - "UI communicates through normalized events/state abstractions, never by directly driving the engine."

performance_rules:
  - "baseCap = min(64, max(8, hardwareConcurrency * 16)); cap halves under drops/steals, doubles back when healthy."
  - "Voice stealing: release-phase voices first, then sustain-held, then longest-sounding."
  - "Same-note presses retrigger with fast release (env.release * 0.25); release tail 0.03s for cut-off pending offs."
  - "Decoded LRU cache budget ~128 MB (DEFAULT_MAX_DECODED_BYTES)."
  - "Limiter worklet clock()/level() are the trusted render-thread measurement path."

testing_rules:
  - "Never weaken existing assertions."
  - "Add regression tests for real bugs (prove fail pre-fix, pass post-fix)."
  - "Prefer deterministic render-thread measurements over fragile transient analyser timing."
  - "Smoke: run npm run build first, then npm run smoke (headless Chrome/Edge, port 5199)."
  - "Phase completion: typecheck, lint, build, full smoke, then 3 consecutive green smoke runs."

git_rules:
  - "HEAD at 7d8535f (Phase 7 checkpoint) with uncommitted Phase 7.5 and Phase 8 work in the tree."
  - "Never reset user work, delete unrelated changes, force push, rewrite history silently, or commit secrets / node_modules / dist / temp debug scripts."
  - "Before commits: git status, git diff, git diff --cached. After: git status."
  - "Never push unless explicitly instructed."